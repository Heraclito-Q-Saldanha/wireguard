services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    restart: unless-stopped
    networks:
      - wireguard
    volumes:
      - wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    env_file:
      - path: .env
        required: true
    ports:
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
  caddy:
    image: caddy:2.11.4
    container_name: wg-easy-caddy
    restart: unless-stopped
    networks:
      - wireguard
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    env_file:
      - path: .env
        required: true
    ports:
      - 80:80
      - 443:443

networks:
  wireguard:

volumes:
  wireguard:
  caddy_data:
  caddy_config:
